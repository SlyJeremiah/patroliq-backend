# Render Blueprint for the PATROLIQ API (https://render.com/docs/blueprint-spec).
# Secrets are declared with `sync: false`: Render asks for their values when the Blueprint is created;
# nothing secret lives in this file. DJANGO_SECRET_KEY is generated by Render.
services:
  - type: web
    name: patroliq-api
    runtime: python
    plan: starter         # pre-deploy commands need a paid instance type
    region: ohio          # same AWS region as the Neon project (us-east-2): keeps DB round trips ~1 ms
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Runs over DATABASE_URL_DIRECT (manage.py switches automatically for migrate).
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn patroliq.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile -
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # RENDER_EXTERNAL_HOSTNAME is added to ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS automatically.
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS   # ops admin (/ops-admin/) behind HTTPS
        value: https://*.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_HSTS_SECONDS
        value: "31536000"
      - key: WEB_TOTP_REQUIRED             # false = email + password only for web sign-in (not recommended)
        value: "true"
      - key: TRUSTED_PROXY_COUNT           # Render's load balancer appends the client IP to X-Forwarded-For
        value: "1"
      - key: DATABASE_URL                  # Neon pooled URL (host contains -pooler)
        sync: false
      - key: DATABASE_URL_DIRECT           # Neon direct URL, used by migrate
        sync: false
      # Web dashboard (Vercel)
      - key: CORS_ALLOWED_ORIGINS          # e.g. https://patroliq-dashboard.vercel.app
        sync: false
      - key: CORS_ALLOWED_ORIGIN_REGEX     # e.g. ^https://patroliq-dashboard-[a-z0-9-]+\.vercel\.app$
        sync: false
      - key: DASHBOARD_URL                 # optional, share links point here
        sync: false
      - key: WEB_IP_ALLOWLIST              # optional CIDRs for web roles; leave empty for no restriction
        sync: false
      # Uploads + generated reports in a private Cloudflare R2 bucket (local disk is ephemeral on Render)
      - key: FILE_STORAGE                  # database (default on Render without R2) | r2 | local
        value: database
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Notifications
      - key: NOTIFY_BACKEND                # console | twilio_fcm
        value: twilio_fcm
      - key: NOTIFY_ASYNC                  # send after commit on a background thread (never blocks a sync/SOS)
        value: "true"
      - key: SMS_DEFAULT_COUNTRY_CODE      # 0771234567 -> +263771234567
        value: "263"
      - key: TWILIO_ACCOUNT_SID            # AC...
        sync: false
      - key: TWILIO_API_KEY_SID            # SK... (API key auth, preferred) - or leave empty and use the auth token
        sync: false
      - key: TWILIO_API_KEY_SECRET
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_MESSAGING_SERVICE_SID  # MG... - or leave empty and set TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_FROM_NUMBER            # an SMS-capable number owned by the Twilio account, E.164
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_ACCESS_TOKEN
        sync: false
      # Email alerts + sync summaries over SMTP (README "Notifications")
      - key: EMAIL_HOST                    # e.g. smtp.gmail.com / smtp.office365.com / smtp-relay.brevo.com
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_USE_SSL
        value: "false"
      - key: EMAIL_TIMEOUT
        value: "15"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL            # e.g. PATROLIQ Alerts <alerts@example.org>
        sync: false
      - key: EMAIL_ALERTS
        value: "true"
      - key: EMAIL_SYNC_SUMMARIES
        value: "true"
    # Without R2, attach a persistent disk instead (single instance, no zero-downtime deploys):
    # disk:
    #   name: patroliq-media
    #   mountPath: /var/data
    #   sizeGB: 5
    # and set MEDIA_ROOT=/var/data/media.

# Render Blueprint for the PATROLIQ API (https://render.com/docs/blueprint-spec).
# Secrets are declared with `sync: false`: Render asks for their values when the Blueprint is created;
# nothing secret lives in this file. DJANGO_SECRET_KEY is generated by Render.
services:
  - type: web
    name: patroliq-api
    runtime: python
    plan: starter         # pre-deploy commands need a paid instance type
    region: ohio          # same AWS region as the Neon project (us-east-2): keeps DB round trips ~1 ms
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    # Runs over DATABASE_URL_DIRECT (manage.py switches automatically for migrate).
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn patroliq.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile -
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # RENDER_EXTERNAL_HOSTNAME is added to ALLOWED_HOSTS / CSRF_TRUSTED_ORIGINS automatically.
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS   # ops admin (/ops-admin/) behind HTTPS
        value: https://*.onrender.com
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "true"
      - key: DJANGO_HSTS_SECONDS
        value: "31536000"
      - key: WEB_TOTP_REQUIRED             # false = email + password only for web sign-in (not recommended)
        value: "true"
      - key: TRUSTED_PROXY_COUNT           # Render's load balancer appends the client IP to X-Forwarded-For
        value: "1"
      - key: DATABASE_URL                  # Neon pooled URL (host contains -pooler)
        sync: false
      - key: DATABASE_URL_DIRECT           # Neon direct URL, used by migrate
        sync: false
      # Web dashboard (Vercel)
      - key: CORS_ALLOWED_ORIGINS          # e.g. https://patroliq-dashboard.vercel.app
        sync: false
      - key: CORS_ALLOWED_ORIGIN_REGEX     # e.g. ^https://patroliq-dashboard-[a-z0-9-]+\.vercel\.app$
        sync: false
      - key: DASHBOARD_URL                 # optional, share links point here
        sync: false
      - key: WEB_IP_ALLOWLIST              # optional CIDRs for web roles; leave empty for no restriction
        sync: false
      # Uploads + generated reports in a private Cloudflare R2 bucket (local disk is ephemeral on Render)
      - key: FILE_STORAGE                  # database (default on Render without R2) | r2 | local
        value: database
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      # Notifications
      - key: NOTIFY_BACKEND                # console | twilio_fcm
        value: console
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: FCM_PROJECT_ID
        sync: false
      - key: FCM_ACCESS_TOKEN
        sync: false
    # Without R2, attach a persistent disk instead (single instance, no zero-downtime deploys):
    # disk:
    #   name: patroliq-media
    #   mountPath: /var/data
    #   sizeGB: 5
    # and set MEDIA_ROOT=/var/data/media.

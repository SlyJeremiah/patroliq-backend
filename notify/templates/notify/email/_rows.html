<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;margin:4px 0 12px;">

<td style="padding:4px 12px 4px 0;color:#6b7a75;vertical-align:top;white-space:nowrap;width:1%;">{{ label }}</td>
<td style="padding:4px 0;vertical-align:top;">{{ value }}</td>
</tr>{% endfor %}
</table>
